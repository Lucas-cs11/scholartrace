# 构建用锁定依赖 —— 由 requirements.txt 在 python:3.14-slim 内解析后冻结。
#
# 为什么要这份文件：requirements.txt 用的是浮动约束（如 pydantic>=2.5,<3），
# 同一天两次构建一致，隔几周就会解析出不同版本 —— P0 门禁「同 commit 两次构建
# 产物一致」会变成一句空话。镜像只认本文件，版本因此与时间无关。
#
# 重新生成（改了 requirements.txt 之后）：
#   sudo docker run --rm -v "$PWD/requirements.txt:/tmp/requirements.txt:ro" \
#     python:3.14-slim@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d \
#     sh -c 'pip freeze | sort > /tmp/b.txt; pip install -q -r /tmp/requirements.txt; \
#            pip freeze | sort | comm -13 /tmp/b.txt -'
#   然后把输出整段贴到本文件末尾（保留本注释头）。
#
# 注意：本文件是「构建输入」，不是给人改的清单 —— 增删依赖请改 requirements.txt。

