name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（离线、无网络、无 LLM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -rs 让 SKIPPED 及其原因打印到日志：冻结输入缺失必须可见，不得静默
      - name: 运行测试
        run: python -m pytest tests/ -q -rs
